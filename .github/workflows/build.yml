name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd build/SpatialPanner_artefacts/Release
          zip -r "$GITHUB_WORKSPACE/SpatialPanner-macOS.zip" VST3 AU Standalone

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd build/SpatialPanner_artefacts/Release
          Compress-Archive -Path VST3, Standalone -DestinationPath "$env:GITHUB_WORKSPACE/SpatialPanner-Windows.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpatialPanner-${{ matrix.name }}
          path: SpatialPanner-*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SpatialPanner-*.zip
          generate_release_notes: true
